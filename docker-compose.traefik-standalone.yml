# Traefik DEDICADO a este projeto — use quando a VPS não tem nenhum outro
# Traefik já rodando (nada mais ocupando as portas 80/443 do host).
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.traefik-standalone.yml --profile production up -d
#
# Emite certificado via desafio HTTP-01 (mais simples, mas exige que o DNS
# do(s) domínio(s) já esteja apontando para este servidor antes do primeiro
# start — ver seção 1 do DEPLOY.md).
services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS: todo tráfego na porta 80 vira redirect permanente para a mesma URL em 443.
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt via desafio HTTP-01 — funciona sem abrir porta extra, mas exige DNS
      # do(s) domínio(s) já apontando para este servidor antes do primeiro start.
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.docker-data/traefik:/letsencrypt
    profiles:
      - production
