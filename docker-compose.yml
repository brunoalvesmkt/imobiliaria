name: chatbot-saas-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: chatbot_saas
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9004:9000"
      - "127.0.0.1:9005:9001"
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Só em 127.0.0.1: em produção o tráfego externo passa pelo Traefik (ver
    # labels abaixo), não por esta porta publicada diretamente — publicar em
    # 0.0.0.0 furaria o firewall do host (Docker escreve suas próprias regras
    # de iptables, que o ufw não vê). Continua acessível em localhost:3001
    # para uso local sem o profile "production".
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${APP_DOMAIN:-app.localhost}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.web.loadbalancer.server.port=3000"

  # O serviço "traefik" (Traefik próprio, dedicado a este projeto) NÃO mora
  # mais neste arquivo — ver docker-compose.traefik-standalone.yml (quando a
  # VPS não tem nenhum outro Traefik) e docker-compose.traefik-shared.yml
  # (quando já existe um Traefik de outro projeto na mesma VPS, ocupando as
  # portas 80/443 — só pode haver um dono dessas portas por servidor). Ver
  # seção 3 do DEPLOY.md para os dois cenários.
